<p style="font-size:30px;font-weight:700;color:#14213D;letter-spacing:2px">한 줄 결론</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.25;color:#14213D;width:1600px">모델로 고른 대출은 아무거나 고른 대출보다 매년 약 1%p 더 벌었다.</h2>
<p style="font-size:40px;line-height:1.45;color:#14213D;width:1500px">그 차이는 좋은 등급을 골라서가 아니라, <b>같은 등급 안에서 더 나은 대출</b>을 골라낸 데서 나왔다.</p>
<aside>이 슬라이드 한 장이 오늘 발표 전체입니다. 나머지는 이 문장을 왜 믿어도 되는지를 보여주는 근거입니다. 1%p가 작아 보이지만, 1억 원을 넣었다면 매년 약 100만 원이 더 들어오는 정도이고, 무엇보다 우연이 아니라는 것을 여러 방법으로 확인했습니다.</aside>
